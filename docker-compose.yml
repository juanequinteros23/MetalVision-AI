version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: metalvision_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: metalvision_db
      MYSQL_USER: metalvision_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metalvision_network

  redis:
    image: redis:7-alpine
    container_name: metalvision_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metalvision_network

volumes:
  mysql_data:
  redis_data:

networks:
  metalvision_network:
    driver: bridge
