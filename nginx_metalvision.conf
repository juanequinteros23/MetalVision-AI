server {
    server_name 18.221.6.95.sslip.io;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/18.221.6.95.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18.221.6.95.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Frontend React SPA
    location / {
        root /var/www/metalvision/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Samples static directory
    location /samples/ {
        alias /var/www/metalvision/client/dist/samples/;
    }

    # Backend Flask API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
